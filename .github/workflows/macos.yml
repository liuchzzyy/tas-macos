name: Native macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Compatibility and recovery tests
        run: env SWIFT_BACKTRACE=enable=yes,interactive=no,color=no swift test -c release
      - name: CLI version history end-to-end tests
        run: python3 scripts/test-history-cli.py --binary .build/release/tas
      - name: Diagnose a macOS test crash
        if: failure()
        timeout-minutes: 2
        run: |
          python3 scripts/crash-diagnostics.py
          test_bundle="$(swift build -c release --show-bin-path)/TASPackageTests.xctest"
          xcrun lldb --batch -o run -o "thread backtrace all" -- "$(xcrun --find xctest)" -XCTest TASCoreTests.CoreTests/testSyncUsesLegacyRelativePathsAndSourceModificationTimes "$test_bundle"
      - name: Build native app and test installed resources
        timeout-minutes: 8
        run: ./scripts/build-macos.sh
      - name: Launch the native SwiftUI window
        run: swift scripts/smoke-gui.swift "$PWD/dist/TAS.app/Contents/MacOS/TAS" "$PWD/dist"
      - name: Check disk image
        run: |
          hdiutil verify dist/TAS-1.1.0-arm64.dmg
          shasum -a 256 -c dist/TAS-1.1.0-arm64.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TAS-macOS-arm64
          path: |
            dist/TAS-1.1.0-arm64.dmg
            dist/TAS-1.1.0-arm64.dmg.sha256
            dist/build-report-arm64.txt
            dist/gui-launch-report.txt
            dist/TAS-native-window.png
          if-no-files-found: error
